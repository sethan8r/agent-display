; agent-display firmware for ESP32-2432S028 "Cheap Yellow Display" (two-USB version, CYD2USB)

[platformio]
default_envs = hwtest

[env]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
; one big app partition: no OTA (updates go over USB), keeps NVS for settings
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    lovyan03/LovyanGFX@1.2.31
    lvgl/lvgl@9.6.0
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=0
; Inter TTF, rendered on the board by LVGL TinyTTF (tools/gen_fonts.py downloads them)
board_build.embed_files =
    fonts/Inter-400.ttf
    fonts/Inter-600.ttf

; hardware test: display driver, colors, rotation, touch, fonts, light sensor, USB speed
[env:hwtest]
build_src_filter = +<board/> +<hwtest/>
